name: Verify public Userscript channels

on:
  push:
    branches: [main]
    paths:
      - 'beta/**'
      - 'stable/**'
      - 'README.md'
      - '.github/workflows/verify-userscripts.yml'
  pull_request:
    paths:
      - 'beta/**'
      - 'stable/**'
      - 'README.md'
      - '.github/workflows/verify-userscripts.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version, update URLs and complete scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          repository = "Blacksonny/M2Idle-Companion-Updates"
          releases = {}
          for channel in ("beta", "stable"):
              root = Path(channel)
              script = root / "M2Idle-Companion.user.js"
              metadata = root / "M2Idle-Companion.meta.js"
              if not script.exists() and not metadata.exists():
                  print(f"{channel}: noch nicht veröffentlicht")
                  continue
              assert script.is_file() and metadata.is_file(), (
                  f"{channel}: Script und Meta müssen gemeinsam vorhanden sein"
              )
              assert script.stat().st_size < 2_000_000, "Script zu groß"
              assert metadata.stat().st_size < 5_000, "Metadaten zu groß"
              full = script.read_text(encoding="utf-8")
              meta = metadata.read_text(encoding="utf-8")
              assert full.startswith("// ==UserScript==\n"), "Ungültiger Header"
              assert meta.startswith("// ==UserScript==\n"), "Ungültiger Metadaten-Header"
              header = full.split("// ==/UserScript==", 1)[0] + "// ==/UserScript==\n\n"
              assert header == meta, f"{channel}: Metadaten stimmen nicht mit Script überein"
              assert full.count("// ==UserScript==") == 1, "Doppelte Header"
              assert "// @match        https://game.m2idle.pl/*" in meta, "Nicht erwartete Domain"
              assert "// @grant        none" in meta, "Unerwartete Berechtigungen"
              assert "@require" not in meta, "Remote-Lader nicht zulässig"
              version_match = re.search(r"(?m)^// @version\s+(\d+\.\d+\.\d+)$", meta)
              assert version_match, "Version fehlt"
              version = version_match.group(1)
              expected_name = f"M2Idle Companion ({channel.capitalize()})"
              assert f"// @name         {expected_name}" in meta, (
                  f"{channel}: falscher angezeigter Kanalname"
              )
              releases[channel] = version
              channel_readme = (root / "README.md").read_text(encoding="utf-8")
              assert f"**Aktuell veröffentlichte Version: {version}**" in channel_readme, (
                  f"{channel}: README-Version ist nicht die ausgelieferte @version {version}"
              )
              assert f"`{expected_name}`" in channel_readme, (
                  f"{channel}: README hat falschen Installationsnamen"
              )
              base = f"https://raw.githubusercontent.com/{repository}/main/{channel}"
              assert f"// @updateURL    {base}/M2Idle-Companion.meta.js" in meta
              assert f"// @downloadURL  {base}/M2Idle-Companion.user.js" in meta
              assert f"// @namespace    https://github.com/Blacksonny/M2Idle-Companion/userscripts/{channel}" in meta
              for invalid in ("-----BEGIN PRIVATE KEY-----", "-----BEGIN RSA PRIVATE KEY-----"):
                  assert invalid not in full, "Verdacht auf privaten Schlüssel"
              print(f"{channel}: Versionsangaben, Metadaten und Downloadpfade geprüft")
          overview = Path("README.md").read_text(encoding="utf-8")
          for channel, version in releases.items():
              title = channel.capitalize()
              expected_row = f"| **{title}** | **{version}** | `M2Idle Companion ({title})` |"
              assert expected_row in overview, (
                  f"README: {channel} muss @version {version} aus der ausgelieferten Metadatei anzeigen"
              )
          print("README und beide Kanal-READMEs mit den ausgelieferten Scriptversionen abgeglichen")
          PY
          for channel in beta stable; do
            if [[ -f "$channel/M2Idle-Companion.user.js" ]]; then
              node --check "$channel/M2Idle-Companion.user.js"
            fi
          done
